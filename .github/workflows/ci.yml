name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: wasm-pack@0.15.1
      - id: viritura
        run: echo "commit=$(git rev-parse HEAD:vendor/viritura)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/viritura/engine/viritura-wasm/pkg-browser
          key: viritura-wasm-${{ steps.viritura.outputs.commit }}
          restore-keys: viritura-wasm-
      - run: corepack enable
      - run: pnpm install
      - run: pnpm build:viritura
      - run: pnpm test
